<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendar — Portal za članove IK FON-a</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../investicioni_klub_studenata_fona_logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="portal.css">
</head>
<body data-page="kalendar">

<div class="portal-app">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="portal-main">
    <div class="portal-head-row">
      <div class="portal-head">
        <h1 class="h-lead">Kalendar</h1>
        <p class="lead-text">Rokovi projekata, zadataka i drugi važni datumi.</p>
      </div>
      <button type="button" class="btn btn--primary" id="addEventBtn" hidden>+ Dodaj rok</button>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <div class="cal-head">
          <button type="button" id="todayBtn" class="btn btn--ghost btn--sm">Danas</button>
          <div class="cal-nav cal-nav--center">
            <button type="button" id="prevMonth" aria-label="Prethodni mesec">&larr;</button>
            <span class="cal-head__title" id="calTitle">…</span>
            <button type="button" id="nextMonth" aria-label="Sledeći mesec">&rarr;</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div>
        <div class="panel">
          <h3 id="selectedDayTitle">Danas</h3>
          <div id="selectedDayList" class="row-list"></div>
        </div>
        <div class="panel">
          <h3>Predstojeći rokovi</h3>
          <div id="upcomingList" class="row-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modalBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="utils.js"></script>
<script src="auth-guard.js"></script>
<script src="shell.js"></script>
<script src="kalendar.js"></script>
</body>
</html>
