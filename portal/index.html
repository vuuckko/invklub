<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Početna — Portal za članove IK FON-a</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../investicioni_klub_studenata_fona_logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="portal.css">
</head>
<body data-page="dashboard">

<div class="portal-app">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="portal-main">
    <div class="portal-head">
      <h1 class="h-lead">Zdravo, <em id="userFirstName">…</em>.</h1>
    </div>

    <section class="statement" id="heroStats"></section>

    <section class="statement-section">
      <div class="statement-section__head">
        <h2>Aktivni projekti</h2>
        <span class="count" id="activeProjectsCount"></span>
      </div>
      <div id="activeProjects" class="ledger-rows"></div>
    </section>

    <section class="statement-section">
      <div class="statement-columns">
        <div>
          <div class="statement-section__head"><h2>Nadolazeći rokovi</h2></div>
          <div id="upcomingDeadlines" class="mini-rows"></div>
        </div>
        <div>
          <div class="statement-section__head"><h2>Sastav kluba</h2></div>
          <div id="sectorChart" class="mini-rows"></div>
        </div>
      </div>
    </section>

    <section class="statement-section" id="partnersSection">
      <div class="statement-section__head"><h2>Partneri</h2></div>
      <div id="partnerBreakdown" class="mini-rows"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="utils.js"></script>
<script src="auth-guard.js"></script>
<script src="shell.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
